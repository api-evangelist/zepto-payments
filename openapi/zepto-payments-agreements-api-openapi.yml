          minimum: 1
        max_amount:
          type:
          - integer
          - 'null'
          description: The maximum allowed payment amount, in cents.
          example: 100000
          minimum: 1
          maximum: 1000000000
        first_payment_date:
          type:
          - string
          - 'null'
          format: date
          description: The date first payment will be initiated for agreement. Date timezone is Australia Sydney.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
