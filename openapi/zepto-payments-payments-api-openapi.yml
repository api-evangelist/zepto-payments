        priority:
          type: string
          description: Execution priority of payment. `attended` payments will be prioritised over `unattended` payments.
          enum:
          - unattended
          - attended
        creditor:
          type: object
          description: Who and where the payment is sent to. Optional in request if `creditor` details are present on the agreement.
          required:
          - ultimate_party_name
          - party_name
          - account_identifier
          properties:
            party_name:
              type: string
              example: Jane Smith
              minLength: 1
              maxLength: 140
              pattern: ^[ -~]+$
              description: The name of the creditor party must accurately represent the creditor party and may be the same as the ultimate_party_name.
            ultimate_party_name:
              type:
              - string
              - 'null'
              example: Jane Smith
              minLength: 1
              maxLength: 140
              pattern: ^[ -~]+$
              description: The ultimate creditor name must accurately represent the ultimate creditor party and may be the same as the party_name.
            account_identifier:
              $ref: '#/components/schemas/payto.account_identifier'
        creditor_reference:
          type:
          - string
          - 'null'
          example: PYMNT-1003
          minLength: 1
          maxLength: 35
          pattern: ^[ -~]+$
          description: A reference to aid the creditor in reconciling the payment
        debtor:
          type: object
          description: Who and where the payment is from
          required:
          - ultimate_party_name
          - party_name
          - account_identifier
          properties:
            ultimate_party_name:
              type: string
              example: Bob Jane
