        creditor_reference:
          type:
          - string
          - 'null'
          example: PYMNT-1003
          minLength: 1
          maxLength: 35
          pattern: ^[ -~]+$
          description: A reference to aid the creditor in reconciling the payment
        debtor:
          type: object
          description: Optional debtor party name overrides. Allows providing custom debtor party names that differ from the agreement. Only available to integrators with extended KYC permissions. Contact Zepto for more information if you would like this feature enabled for your account.
          properties:
            party_name:
              type: string
              example: Bob Jean
              minLength: 1
              maxLength: 140
              pattern: ^[ -~]+$
              description: The party name of the debtor
            ultimate_party_name:
              type: string
              example: Bob Jane
              description: The ultimate debtor name for the account. Defaults to `party_name` if not provided.
        last_payment:
          type:
          - boolean
          - 'null'
          description: This is a required field with agreements that have a payment_terms.type of `balloon`. If `true`, it indicates that this payment is the last payment for the agreement, and should be validated against the last_payment_date and last_payment_amount. No further payments can be made with the agreement once the last payment has been made. This field should be set to `false` for all other payments against a `balloon` agreement, and must be unset for payments on non-`balloon` agreements.
