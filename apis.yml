aid: zepto-payments
url: https://raw.githubusercontent.com/api-evangelist/zepto-payments/refs/heads/main/apis.yml
name: Zepto
kind: company
description: >-
  Zepto is a Gold Coast, Australia based account-to-account (A2A) payments
  company that gives merchants and platforms programmable, real-time access to
  Australia's core money-movement rails. Its unified REST API moves money over
  the New Payments Platform (NPP) for instant account-to-account payments,
  PayTo for mandated real-time debits, PayID addressing, BECS Direct Entry
  (direct debit and direct credit), and stored-value float accounts, with
  real-time messaging, settlement and reconciliation. Zepto is the first
  non-authorised-deposit-taking institution (non-ADI) approved to connect
  directly to the NPP as a "Connected Institution" for PayTo, positioning it as
  an infrastructure-grade money-movement provider rather than a card acquirer.
  Its API posture is genuinely developer-first and API-native: a public ReadMe
  developer portal, a full sandbox, idempotent asynchronous payment flows,
  webhook notifications, and seven downloadable OpenAPI specifications covering
  the core payments API, PayTo, Confirmation of Payee (Validate), disputes,
  clients, merchant reports and notifications.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Australia
- Real-Time Payments
- Account-to-Account
- New Payments Platform
- PayTo
- PayID
- Direct Entry
- Open Banking
- Money Movement
created: '2026-07-24'
modified: '2026-07-24'
