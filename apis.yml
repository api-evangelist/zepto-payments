- aid: zepto-payments:zepto-payments-payment-requests-api
  name: Zepto Payment Requests API
  description: >-
    A Payment Request (PR) is used to collect funds, via direct debit, from one of your Contacts (as long
    as there is an accepted Agreement in place).


    <div class="middle-header">Applicable scenarios</div>


    1. **You send a Payment Request to a [Contact](/#Zepto-API-Contacts) in order to collect funds:**
        1. Given there is an Agreement in place and the Payment Request is within the terms of the Agreement,
    then it will be automatically approved; **or**
        1. Given the Payment Request is **not** within the terms of the Agreement, then it will not be
    created; **or**
        1. There is no Agreement in place, then it will not be created.
    1. **Your customer sends funds to you as a [Receivable Contact](/#add-a-receivable-contact):**
        1. A *receivable* Payment Request will be automatically created and approved to identify the movement
    of funds from your customer to your chosen Zepto float account.


    ##Lifecycle


    <aside class="notice">Payment Requests generated from a customer sending you funds will always be
    <code>approved</code></aside>


    A Payment Request can have the following statuses:


    | Status | Description |

    |-------|-------------|

    | `approved` | The debtor has approved the Payment Request. |

    | `cancelled` | The creditor has cancelled the Payment Request. |


    <div class="middle-header">Prechecking</div>


    When using Payment Requests to collect payments from your customer, Zepto will automatically check
    for available funds before **attempting to debit** the debtor. This check is only performed for contacts
    with an active [bank connection](/#Zepto-API-Bank-Connections).
  humanURL: https://docs.zeptopayments.com/reference/zepto-api
  baseURL: https://api.zeptopayments.com
