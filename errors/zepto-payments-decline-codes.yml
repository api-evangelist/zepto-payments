    meaning: Voided By Initiator — the transaction was voided by its initiator.
    retryable: false
  - code: E252
    rail: de-debit
    meaning: Insufficient Funds — there were insufficient funds to complete the transaction.
    retryable: false
  - code: E253
    rail: de-debit
    meaning: System Error (DE Debit) — the transaction was unable to be completed.
    retryable: true
  - code: E299
    rail: de-debit
    meaning: Unknown DE Error.
    retryable: false
