envelope:
  note: >-
    Failure/reason codes appear on a failed payment/payout transaction as a
    reason code. In sandbox, magic payment amounts trigger each code (see
    sandbox/zepto-payments-sandbox.yml). Codes are grouped by rail: DE Debit
    (E2xx), DE Credit (E1xx), and NPP Credit (E3xx).
masked_to_buyers: false
decline_codes:
  # DE Debit failures (E2xx) — sandbox trigger amount $2.xx
  - code: E201
    rail: de-debit
    meaning: Invalid BSB Number — the BSB is not valid or is no longer active.
    retryable: false
  - code: E202
    rail: de-debit
    meaning: Payment Stopped — the target institution has blocked transactions to this account.
    retryable: false
  - code: E203
    rail: de-debit
    meaning: Account Closed — the target account is closed.
    retryable: false
  - code: E204
    rail: de-debit
    meaning: Customer Deceased — the target account's owner has been listed as deceased.
    retryable: false
  - code: E205
    rail: de-debit
    meaning: Account Not Found — the target account number is incorrect.
    retryable: false
  - code: E206
    rail: de-debit
    meaning: Refer to Customer — usually insufficient funds or a transaction limit breach.
    retryable: false
  - code: E208
    rail: de-debit
    meaning: Invalid UserID — contact Zepto for further information.
    retryable: false
  - code: E209
    rail: de-debit
